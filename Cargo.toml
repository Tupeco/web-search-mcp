[package]
name = "web-search-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted MCP server that makes HTTP requests, with a separate tool per HTTP method and URL allowlists"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
toml = "1"
url = "2"

[dev-dependencies]
flate2 = "1"

[profile.release]
strip = true
lto = "thin"
