# Add inside the existing `server { listen 443 ssl; server_name mcp.example.com; ... }` block.
location /mcp {
    # Anthropic's published outbound range for MCP connector calls
    # (https://platform.claude.com/docs/en/api/ip-addresses). With this, only
    # Claude's cloud can reach the endpoint, even if the URL leaks.
    allow 160.79.104.0/21;
    deny all;

    # The connector URL carries the token, so keep it out of the access log.
    access_log off;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Responses are plain JSON, but tool calls can take up to limits.timeout_ms.
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}
