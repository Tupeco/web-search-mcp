# Add inside the existing TLS server block for mcp.dev.citadelstation.net.
# The trailing slashes strip the prefix: /web-search/mcp reaches the container as /mcp.
location /web-search/ {
    # Anthropic's published outbound range for MCP connector calls
    # (https://platform.claude.com/docs/en/api/ip-addresses). With this, only
    # Claude's cloud can reach the endpoint. Add your own IP to test with curl.
    allow 160.79.104.0/21;
    deny all;

    # If you use the allow_token_in_url fallback, uncomment this: the URL then
    # carries the token.
    # access_log off;

    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Responses are plain JSON, but a tool call can take up to limits.timeout_ms.
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}
