services:
  web-search-mcp:
    build: ..
    image: web-search-mcp
    container_name: web-search-mcp
    restart: unless-stopped
    # Only nginx on the host can reach it.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config.toml:/config/config.toml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
